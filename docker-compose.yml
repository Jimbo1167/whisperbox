services:
  transcription-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./transcripts:/app/transcripts
    # Same settings as a local run: everything in the project .env (create it
    # with `cp .env.example .env`). Without one, the image defaults apply.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
